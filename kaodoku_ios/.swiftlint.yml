included:
  - Kaodoku
  - Tests

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace

# UIKit `dequeueReusableCell(...) as! Cell` is safe.
force_cast: warning

# short names (id, e, u, rt, ...) are used deliberately throughout.
identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
type_name:
  min_length:
    warning: 2
nesting:
  type_level:
    warning: 2

# SwiftUI view bodies and a few model files are long.
function_body_length:
  warning: 120
  error: 400
type_body_length:
  warning: 400
  error: 1000
file_length:
  warning: 600
  error: 2000
line_length:
  warning: 140
  error: 240
