services:
  mangad:
    build: .
    command:
      - serve
      - --addr
      - :8080
      - --db
      - /data/mangad.db
    ports:
      # The API has no auth by default; keep it bound to the host's loopback
      # or set MANGAD_API_KEY before exposing it to the network.
      - "127.0.0.1:8080:8080"
    environment:
      XDG_CONFIG_HOME: /config
      MANGAD_DOWNLOAD_DIR: /downloads
      # MANGAD_API_KEY: change-me
      MANGAD_BROWSER_DOWNLOADER_ENABLED: "true"
      MANGAD_BROWSER_DOWNLOADER_ENDPOINT: http://browser-worker:8192
      MANGAD_BROWSER_DOWNLOADER_TIMEOUT_SECONDS: "180"
      MANGAD_BROWSER_SOLVER_ENABLED: "true"
      MANGAD_BROWSER_SOLVER_ENDPOINT: http://flaresolverr:8191/v1
      MANGAD_BROWSER_SOLVER_TIMEOUT_SECONDS: "60"
    volumes:
      - mangad-config:/config
      - mangad-data:/data
      - mangad-downloads:/downloads
    depends_on:
      browser-worker:
        condition: service_healthy
      flaresolverr:
        condition: service_started

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8191:8191"

  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: 4gb
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports:
      - "127.0.0.1:4444:4444"

  browser-worker:
    build: ./browser-worker
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      BROWSER_WORKER_ADDR: 0.0.0.0:8192
    ports:
      - "127.0.0.1:8192:8192"
    depends_on:
      selenium:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8192/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

