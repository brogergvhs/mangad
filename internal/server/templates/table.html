{{define "table"}}
<div id="{{.ID}}" class="table-box" {{if .Poll}}hx-get="{{.PageURL .Page}}" hx-trigger="load delay:4s" hx-swap="outerHTML" hx-sync="this:replace"{{end}}>
  <div class="rounded-xl overflow-hidden">
  <table class="table">
    <tbody>
    {{range .Rows}}
    <tr class="{{.Class}}{{if .Detail}} row-toggle hover:bg-base-100{{end}}" {{if .Detail}}data-target="det-{{$.ID}}-{{.ID}}"{{end}}>
      {{if $.HasDetails}}<td class="w-6">{{if .Detail}}<span class="caret text-base-content/50">{{template "iconChevron"}}</span>{{end}}</td>{{end}}
      {{range .Cells}}<td>{{.}}</td>{{end}}
    </tr>
    {{if .Detail}}<tr id="det-{{$.ID}}-{{.ID}}" class="bg-base-300/30" hidden><td colspan="{{$.ColSpan}}">{{.Detail}}</td></tr>{{end}}
    {{else}}<tr><td colspan="{{.ColSpan}}" class="text-base-content/60">{{.Empty}}</td></tr>{{end}}
    </tbody>
  </table>
  </div>
  {{if gt .TotalPages 1}}
  <div class="mt-3 flex max-sm:flex-col max-sm:gap-2 sm:items-center sm:justify-between">
    <span class="text-sm text-base-content/60 max-sm:text-center">{{.RangeStart}}–{{.RangeEnd}} of {{.Total}}</span>
    <div class="join max-sm:w-full">
      <button class="btn btn-sm join-item max-sm:flex-1" {{if not .HasPrev}}disabled{{end}} hx-get="{{.PageURL .Prev}}" hx-target="#{{.ID}}" hx-swap="outerHTML" hx-sync="#{{.ID}}:replace">‹</button>
      <button class="btn btn-sm join-item pointer-events-none max-sm:flex-1">{{.Page}} / {{.TotalPages}}</button>
      <button class="btn btn-sm join-item max-sm:flex-1" {{if not .HasNext}}disabled{{end}} hx-get="{{.PageURL .Next}}" hx-target="#{{.ID}}" hx-swap="outerHTML" hx-sync="#{{.ID}}:replace">›</button>
    </div>
  </div>
  {{end}}
</div>
{{end}}
